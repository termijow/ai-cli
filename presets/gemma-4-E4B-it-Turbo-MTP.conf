# ==============================================================================
# PRESET DE RENDIMIENTO PARA: gemma-4-E4B-it-Turbo-MTP
# Optimizado para Speculative Decoding con MTP (Multi-Token Prediction) y 64K Contexto
# ==============================================================================

AI_PRESET_NAME="Gemma 4 E4B Turbo (Speculative MTP 64K)"
AI_PRESET_DESC="Máxima velocidad de inferencia usando cabeza draft MTP dedicada con 64k contexto"
AI_ESTIMATED_TOKS="60-80 tok/s (Turbo MTP)"

# Configuración del Modelo
MODEL_FILE="gemma-4-E4B-it-Q4_K_M.gguf"
MODEL_REPO="local/gemma-4-E4B-it-Q4_K_M.gguf"

# Configuración GPU / VRAM (RX 6600 8GB)
AI_GPU_LAYERS=99
AI_CTX_SIZE=65536
AI_BATCH_SIZE=1024
AI_UBATCH_SIZE=512

# Formato de KV Cache
AI_CACHE_TYPE_K=q4_0
AI_CACHE_TYPE_V=q4_0

# Razonamiento / Thinking
AI_REASONING=on
AI_THINKING_LEVEL=low

# Parámetros de Inferencia y Muestreo
AI_MAX_TOKENS=8192
AI_TEMPERATURE=1.0
AI_TOP_P=0.95
AI_TOP_K=64

# Speculative Decoding / MTP
AI_SPEC_TYPE=draft-mtp
AI_MODEL_DRAFT=mtp-gemma-4-E4B-it-Q4_0.gguf
AI_SPEC_DRAFT_N_MAX=3
AI_FIT=off
AI_MMPROJ=""
