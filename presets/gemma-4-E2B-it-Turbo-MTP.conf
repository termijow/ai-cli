# ==============================================================================
# PRESET DE RENDIMIENTO PARA: gemma-4-E2B-it-Turbo-MTP
# Optimizado para Speculative Decoding con MTP (Multi-Token Prediction) y 64K Contexto
# ==============================================================================

AI_PRESET_NAME="Gemma 4 E2B Turbo (Speculative MTP 64K)"
AI_PRESET_DESC="Ultra velocidad para Claude Code y desarrollo con 64k de contexto"
AI_ESTIMATED_TOKS="80-110 tok/s (Ultra Turbo MTP)"

# Configuración del Modelo
MODEL_FILE="gemma-4-E2B-it-Q4_K_M.gguf"
MODEL_REPO="local/gemma-4-E2B-it-Q4_K_M.gguf"

# Configuración GPU / VRAM (RX 6600 8GB)
AI_GPU_LAYERS=99
AI_CTX_SIZE=65536
AI_BATCH_SIZE=2048
AI_UBATCH_SIZE=512

# Formato de KV Cache (q4_0 mantiene 64k tokens ocupando solo ~1.6GB de VRAM)
AI_CACHE_TYPE_K=q4_0
AI_CACHE_TYPE_V=q4_0

# Razonamiento / Thinking
AI_REASONING=on
AI_THINKING_LEVEL=low

# Parámetros de Inferencia y Muestreo
AI_MAX_TOKENS=8192
AI_TEMPERATURE=1.0
AI_TOP_P=0.95
AI_TOP_K=64

# Speculative Decoding / MTP
AI_SPEC_TYPE=draft-mtp
AI_MODEL_DRAFT=mtp-gemma-4-E2B-it-Q4_0.gguf
AI_SPEC_DRAFT_N_MAX=4
AI_FIT=off
AI_MMPROJ=""
