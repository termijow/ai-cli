# ==============================================================================
# PRESET DE RENDIMIENTO PARA: Inkling-2-Mini-UD-IQ1_S.gguf
# Thinking Machines Lab 26.4B MoE Looped Architecture (Unsloth Dynamic IQ1_S)
# Optimizado para Vulkan GPU + RAM en AMD Radeon RX 6600 8GB
# ==============================================================================

AI_PRESET_NAME="Inkling 2 Mini UD-IQ1_S"
AI_PRESET_DESC="26.4B MoE Looped (Unsloth Dynamic IQ1_S) - Razonamiento profundo en GPU Vulkan + RAM"
AI_ESTIMATED_TOKS="~2-4 tok/s"

# Configuración del Modelo
MODEL_FILE="Inkling-2-Mini-UD-IQ1_S.gguf"
MODEL_REPO="local/Inkling-2-Mini-UD-IQ1_S.gguf"

# Configuración GPU / VRAM (RX 6600 8GB)
AI_GPU_LAYERS=12
AI_CTX_SIZE=16384
AI_BATCH_SIZE=1024
AI_UBATCH_SIZE=512

# KV Cache optimizada para ahorrar VRAM
AI_CACHE_TYPE_K=q4_0
AI_CACHE_TYPE_V=q4_0

# Razonamiento / Thinking nativo
AI_REASONING=on
AI_THINKING_LEVEL=low

# Límite de salida y muestreo
AI_MAX_TOKENS=8192
AI_TEMPERATURE=0.6
AI_TOP_P=0.95
AI_TOP_K=40
AI_MTP=off
