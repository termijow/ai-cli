AI_PRESET_NAME="Gemma 4 26B-A4B (MoE MTP Híbrido)"
AI_PRESET_DESC="Google MoE 26B (4B activos) con MTP calibrado para 8GB VRAM + 16GB RAM"
AI_ESTIMATED_TOKS="22-28 tok/s"

# Configuración del Modelo
MODEL_FILE="gemma-4-26B-A4B-it-UD-IQ2_XXS.gguf"
MODEL_REPO="unsloth/gemma-4-26B-A4B-it-GGUF"

# Configuración GPU / VRAM (RX 6600 8GB + 16GB RAM)
# 24 capas en GPU (~5.8GB VRAM) + capas restantes en RAM (~3.4GB RAM)
