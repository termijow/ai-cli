AI_CTX_SIZE=8192
AI_BATCH_SIZE=1024
AI_UBATCH_SIZE=256

# Formato de KV Cache
AI_CACHE_TYPE_K="q4_0"
AI_CACHE_TYPE_V="q4_0"

# Razonamiento / Thinking
AI_REASONING="on"
