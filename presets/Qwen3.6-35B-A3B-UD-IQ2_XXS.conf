# ==============================================================================
# PRESET DE RENDIMIENTO PARA: Qwen3.6-35B-A3B-UD-IQ2_XXS.gguf
# MoE 35B con MTP nativo (Multi-Token Prediction) calibrado para 8GB VRAM + 16GB RAM
# Modo Programación / Claude Code de Alto Contexto (65k tokens)
# ==============================================================================

AI_PRESET_NAME="Qwen 3.6 35B-A3B (MTP + 65k Ctx Coding)"
AI_PRESET_DESC="MoE 35B con MTP nativo, 65k contexto y respuesta instantanea sin esperas de thinking"
AI_ESTIMATED_TOKS="18-24 tok/s"

# Configuracion del Modelo
MODEL_FILE="Qwen3.6-35B-A3B-UD-IQ2_XXS.gguf"
MODEL_REPO="unsloth/Qwen3.6-35B-A3B-MTP-GGUF"

# Configuracion GPU / VRAM (RX 6600 8GB + 16GB RAM)
# 18 capas en GPU (~4.8GB VRAM) dejando espacio holgado para 65k-100k contexto en KV Cache q4_0
AI_GPU_LAYERS=18
AI_CTX_SIZE=65536
AI_BATCH_SIZE=2048
AI_UBATCH_SIZE=512

# Formato de KV Cache ultra-ahorro (ocupa solo ~1.3 GB de VRAM a 65k tokens)
AI_CACHE_TYPE_K="q4_0"
AI_CACHE_TYPE_V="q4_0"

# Razonamiento / Thinking
# En "off" para Claude Code y programacion rapida: responde al instante sin generar miles de tokens <think>
# Cambia a "low" (512-1024 tokens) o "high" (8192 tokens) para razonamiento matematico profundo
AI_REASONING="off"
AI_THINKING_LEVEL="off"

# Multi-Token Prediction (MTP) Nativo
AI_MTP="on"
AI_MTP_DRAFT_MAX=2

# Parametros de Inferencia y Muestreo de Alta Calidad
AI_MAX_TOKENS=8192
AI_TEMPERATURE=0.6
AI_TOP_P=0.95
AI_TOP_K=40
