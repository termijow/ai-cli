<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake Cyberpunk</title>
    <style>
        :root {
            --bg-color: #050505;
            --grid-line: #1a1a1a;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff41;
            --text-color: #ffffff;
            --ui-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none; /* Prevenir zoom/scroll en móviles */
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            text-shadow: 0 0 5px var(--neon-cyan);
            font-weight: bold;
        }

        .score-box span { color: var(--neon-green); }
        .highscore-box span { color: var(--neon-pink); }

        /* Pantallas de Estado */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ui-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .screen.active { opacity: 1; }

        h1 {
            font-size: 40px;
            margin: 0 0 20px 0;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 2px 2px 0px #000;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        button {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 30px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            margin: 10px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        button:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        /* Controles Táctiles */
        #controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .d-pad-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            user-select: none;
            touch-action: manipulation;
        }

        .d-pad-btn:active { background: rgba(0, 243, 255, 0.3); }
        
        /* Layout D-Pad */
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* Ocultar controles en desktop si se desea, pero los dejaremos para accesibilidad */
        @media (min-width: 768px) {
            #controls { opacity: 0.2; }
            #controls:hover { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="ui-layer">
            <div class="hud">
                <div class="score-box">SCORE: <span id="scoreEl">0</span></div>
                <div class="highscore-box">HI: <span id="highScoreEl">0</span></div>
            </div>
        </div>

        <!-- Pantalla de Inicio -->
        <div id="startScreen" class="screen active">
            <h1>NEON SNAKE</h1>
            <p style="margin-bottom: 20px; opacity: 0.8;">WASD / FLECHAS / TÁCTIL</p>
            <button id="btnStart">INICIAR SISTEMA</button>
        </div>

        <!-- Pantalla Game Over -->
        <div id="gameOverScreen" class="screen">
            <h1 style="color: #ff3333; text-shadow: 0 0 10px red;">SYSTEM FAILURE</h1>
            <p>SCORE: <span id="finalScore" style="color:white">0</span></p>
            <button id="btnRestart">REINICIAR</button>
            <button id="btnPause" style="display:none">PAUSAR</button>
        </div>
        
        <!-- Pantalla Pausa -->
        <div id="pauseScreen" class="screen">
            <h1>PAUSED</h1>
            <button id="btnResume">RESUMIR</button>
        </div>
    </div>

    <!-- Controles Táctiles -->
    <div id="controls">
        <div class="d-pad-btn" id="btn-up">▲</div>
        <div class="d-pad-btn" id="btn-left">◀</div>
        <div class="d-pad-btn" id="btn-down">▼</div>
        <div class="d-pad-btn" id="btn-right">▶</div>
    </div>

<script>
/**
 * NEON SNAKE - CORE ENGINE
 * Arquitectura: State Machine + Entity Component System (simplificado)
 */

// --- CONFIGURACIÓN ---
const CONFIG = {
    GRID_SIZE: 20,
    TILE_COUNT: 30, // 600px / 20px
    BASE_SPEED: 10, // Ticks por segundo
    COLORS: {
        bg: '#050505',
        snakeHead: '#ffffff',
        snakeBody: '#00f3ff',
        food: '#ff00ff',
        grid: '#111'
    }
};

// --- AUDIO SYSTEM (Web Audio API) ---
const AudioSys = (() => {
    let ctx = null;
    let masterGain = null;

    const init = () => {
        if (!ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            ctx = new AudioContext();
            masterGain = ctx.createGain();
            masterGain.gain.value = 0.3; // Volumen global bajo
            masterGain.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
    };

    const playTone = (freq, type, duration, vol = 1) => {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = type; // 'sine', 'square', 'triangle', 'sawtooth'
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(masterGain);
        
        osc.start();
        osc.stop(ctx.currentTime + duration);
    };

    return {
        init,
        eat: () => playTone(600, 'sine', 0.1, 0.5),
        grow: () => playTone(400, 'triangle', 0.1, 0.3),
        die: () => {
            playTone(150, 'sawtooth', 0.4, 0.8);
            playTone(100, 'square', 0.4, 0.8);
        },
        move: () => playTone(100, 'square', 0.05, 0.1) // Sonido muy sutil al mover
    };
})();

// --- CLASES DEL JUEGO ---

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 4, 4);
        ctx.globalAlpha = 1.0;
    }
}

class Snake {
    constructor() {
        this.reset();
    }

    reset() {
        this.body = [
            { x: 10, y: 10 },
            { x: 10, y: 11 },
            { x: 10, y: 12 }
        ];
        this.dx = 0;
        this.dy = -1;
        this.nextDx = 0;
        this.nextDy = -1;
        this.growPending = 0;
        this.color = CONFIG.COLORS.snakeBody;
    }

    update() {
        // Aplicar dirección bufferada (previene giros de 180 en un tick)
        if (this.nextDx !== 0 || this.nextDy !== 0) {
            // Evitar reversa directa
            if (this.nextDx !== -this.dx && this.nextDy !== -this.dy) {
                this.dx = this.nextDx;
                this.dy = this.nextDy;
            }
        }

        const head = { x: this.body[0].x + this.dx, y: this.body[0].y + this.dy };

        // Colisión Paredes
        if (head.x < 0 || head.x >= CONFIG.TILE_COUNT || head.y < 0 || head.y >= CONFIG.TILE_COUNT) {
            return false; // Game Over
        }

        // Colisión Cuerpo
        for (let part of this.body) {
            if (head.x === part.x && head.y === part.y) {
                return false; // Game Over
            }
        }

        this.body.unshift(head);

        if (this.growPending > 0) {
            this.growPending--;
        } else {
            this.body.pop();
        }

        return true;
    }

    draw(ctx) {
        // Dibujar cuerpo
        this.body.forEach((part, index) => {
            const x = part.x * CONFIG.GRID_SIZE;
            const y = part.y * CONFIG.GRID_SIZE;
            
            // Efecto gradiente neón
            ctx.fillStyle = index === 0 ? CONFIG.COLORS.snakeHead : this.color;
            
            // Glow effect
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            
            // Cuerpo un poco más pequeño que la celda para ver la rejilla
            ctx.fillRect(x + 1, y + 1, CONFIG.GRID_SIZE - 2, CONFIG.GRID_SIZE - 2);
            
            // Reset shadow para rendimiento
            ctx.shadowBlur = 0;
        });
    }
}

class Food {
    constructor(snake) {
        this.snake = snake;
        this.respawn();
    }

    respawn() {
        let valid = false;
        while (!valid) {
            this.x = Math.floor(Math.random() * CONFIG.TILE_COUNT);
            this.y = Math.floor(Math.random() * CONFIG.TILE_COUNT);
            
            valid = true;
            for (let part of this.snake.body) {
                if (part.x === this.x && part.y === this.y) {
                    valid = false;
                    break;
                }
            }
        }
    }

    draw(ctx) {
        const x = this.x * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE/2;
        const y = this.y * CONFIG.GRID_SIZE + CONFIG.GRID_SIZE/2;
        
        ctx.fillStyle = CONFIG.COLORS.food;
        ctx.shadowBlur = 15;
        ctx.shadowColor = CONFIG.COLORS.food;
        
        // Dibujar manzana estilo pixel/retro
        ctx.beginPath();
        ctx.arc(x, y, CONFIG.GRID_SIZE/2 - 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
    }
}

// --- GAME ENGINE ---

const Game = (() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreEl = document.getElementById('scoreEl');
    const highScoreEl = document.getElementById('highScoreEl');
    const finalScoreEl = document.getElementById('finalScore');
    const screens = {
        start: document.getElementById('startScreen'),
        gameover: document.getElementById('gameOverScreen'),
        pause: document.getElementById('pauseScreen')
    };
    const btns = {
        start: document.getElementById('btnStart'),
        restart: document.getElementById('btnRestart'),
        pause: document.getElementById('btnPause'),
        resume: document.getElementById('btnResume')
    };

    let state = {
        running: false,
        paused: false,
        score: 0,
        highScore: parseInt(localStorage.getItem('snake_highscore')) || 0,
        lastTime: 0,
        tickAccumulator: 0,
        shake: 0
    };

    let snake = new Snake();
    let food = new Food(snake);
    let particles = [];
    let inputQueue = []; // Para manejar inputs rápidos

    // Inicializar UI
    highScoreEl.innerText = state.highScore;

    // --- INPUT HANDLING ---
    const handleInput = (dx, dy) => {
        // Solo permitir input si no estamos pausados o muertos
        if (state.running && !state.paused) {
            // Prevenir reversa inmediata
            if (dx !== 0 && snake.dx === -dx) return;
            if (dy !== 0 && snake.dy === -dy) return;
            
            snake.nextDx = dx;
            snake.nextDy = dy;
        }
    };

    // Teclado
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') handleInput(0, -1);
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') handleInput(0, 1);
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleInput(-1, 0);
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleInput(1, 0);
        
        if (e.key === 'Escape') togglePause();
    });

    // Táctil (D-Pad)
    const bindTouch = (id, dx, dy) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(dx, dy); }, {passive: false});
        el.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput(dx, dy); }); // Para pruebas con mouse
    };
    bindTouch('btn-up', 0, -1);
    bindTouch('btn-down', 0, 1);
    bindTouch('btn-left', -1, 0);
    bindTouch('btn-right', 1, 0);

    // --- GAME LOGIC ---

    const spawnParticles = (x, y, color) => {
        const rect = canvas.getBoundingClientRect();
        const pixelX = (x * CONFIG.GRID_SIZE) + (CONFIG.GRID_SIZE/2);
        const pixelY = (y * CONFIG.GRID_SIZE) + (CONFIG.GRID_SIZE/2);
        
        for(let i=0; i<8; i++) {
            particles.push(new Particle(pixelX, pixelY, color));
        }
    };

    const gameOver = () => {
        state.running = false;
        AudioSys.die();
        state.shake = 20; // Screen shake intensity
        
        if (state.score > state.highScore) {
            state.highScore = state.score;
            localStorage.setItem('snake_highscore', state.highScore);
            highScoreEl.innerText = state.highScore;
        }

        finalScoreEl.innerText = state.score;
        screens.gameover.classList.add('active');
        btns.pause.style.display = 'none';
    };

    const togglePause = () => {
        if (!state.running) return;
        state.paused = !state.paused;
        
        if (state.paused) {
            screens.pause.classList.add('active');
            btns.pause.style.display = 'block';
        } else {
            screens.pause.classList.remove('active');
            btns.pause.style.display = 'none';
            state.lastTime = performance.now(); // Reset delta time
            requestAnimationFrame(loop);
        }
    };

    const startGame = () => {
        AudioSys.init(); // Necesario para interacción usuario
        state.score = 0;
        state.running = true;
        state.paused = false;
        state.shake = 0;
        snake.reset();
        food.respawn();
        particles = [];
        
        scoreEl.innerText = '0';
        screens.start.classList.remove('active');
        screens.gameover.classList.remove('active');
        screens.pause.classList.remove('active');
        
        state.lastTime = performance.now();
        requestAnimationFrame(loop);
    };

    const update = () => {
        // Screen Shake decay
        if (state.shake > 0) state.shake *= 0.9;
        if (state.shake < 0.5) state.shake = 0;

        // Update Snake
        const survived = snake.update();
        if (!survived) {
            gameOver();
            return;
        }

        // Check Food
        if (snake.body[0].x === food.x && snake.body[0].y === food.y) {
            state.score += 10;
            scoreEl.innerText = state.score;
            AudioSys.eat();
            spawnParticles(food.x, food.y, CONFIG.COLORS.food);
            snake.growPending++;
            food.respawn();
        } else {
            // Sonido sutil de movimiento (opcional, puede ser molesto, lo dejo comentado o muy bajo)
            // AudioSys.move(); 
        }
    };

    const draw = () => {
        // Limpiar canvas
        ctx.fillStyle = CONFIG.COLORS.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Aplicar Screen Shake
        ctx.save();
        if (state.shake > 0) {
            const dx = (Math.random() - 0.5) * state.shake;
            const dy = (Math.random() - 0.5) * state.shake;
            ctx.translate(dx, dy);
        }

        // Dibujar Grid (Retro effect)
        ctx.strokeStyle = CONFIG.COLORS.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= CONFIG.TILE_COUNT; i++) {
            // Vertical
            ctx.moveTo(i * CONFIG.GRID_SIZE, 0);
            ctx.lineTo(i * CONFIG.GRID_SIZE, canvas.height);
            // Horizontal
            ctx.moveTo(0, i * CONFIG.GRID_SIZE);
            ctx.lineTo(canvas.width, i * CONFIG.GRID_SIZE);
        }
        ctx.stroke();

        // Dibujar Entidades
        food.draw(ctx);
        snake.draw(ctx);

        // Dibujar Partículas
        particles.forEach((p, i) => {
            p.update();
            p.draw(ctx);
            if (p.life <= 0) particles.splice(i, 1);
        });

        ctx.restore();
    };

    const loop = (time) => {
        if (!state.running) return;

        const deltaTime = time - state.lastTime;
        state.lastTime = time;

        if (!state.paused) {
            state.tickAccumulator += deltaTime;
            // Velocidad constante: 10 ticks por segundo
            if (state.tickAccumulator > 1000 / CONFIG.BASE_SPEED) {
                update();
                state.tickAccumulator = 0;
            }
        }

        draw();
        requestAnimationFrame(loop);
    };

    // Expose methods to UI
    return {
        start: startGame,
        togglePause: togglePause
    };
})();

// --- EVENT LISTENERS UI ---
btns.start.addEventListener('click', () => {
    Game.start();
});

btns.restart.addEventListener('click', () => {
    Game.start();
});

btns.pause.addEventListener('click', () => {
    Game.togglePause();
});

btns.resume.addEventListener('click', () => {
    Game.togglePause();
});

</script>
</body>
</html>
