    <title>Cyber Snake</title>

            justify-content: center;

            height: 100vh;

            color: #00ff00;
        }
        canvas {
            border: 4px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            background-color: #000;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .screen {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid #00ffff;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px #00ffff;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        .screen h1 {
            margin: 0 0 20px 0;
            font-size: 3rem;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            color: #fff;
        }
        .screen h1 span {
            color: #ff00ff;
        }
        .score-display {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #fff;
        }
        .highscore-display {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #00ffff;
        }
        .controls-hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #00ffff;
            text-align: center;
        }
        .controls-hint span {
            color: #00ffff;
            font-weight: bold;
        }
        .shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(-1px, -1px) rotate(-1deg); }
            50% { transform: translate(1px, 2px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(-1px, -1px) rotate(-1deg); }
            80% { transform: translate(3px, 2px) rotate(0deg); }
            90% { transform: translate(1px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }
    </style>

 * ENGINE & LOGIC

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = {
    gameOver: document.getElementById('game-over-screen'),
    start: document.getElementById('start-screen'),
    final: document.getElementById('final-score'),
    highscore: document.getElementById('highscore'),
    restart: document.getElementById('restart-btn'),
    start: document.getElementById('start-btn')
};

// Audio Context
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

// Particles
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 5 + 2;
        this.speedX = Math.random() * 3 - 1.5;
        this.speedY = Math.random() * 3 - 1.5;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.01;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= this.decay;
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

// Game Constants
const GRID_SIZE = 20;
const TILE_COUNT = canvas.width / GRID_SIZE;
const INITIAL_SPEED = 10;
const MIN_SPEED = 5;

// State
let score = 0;
let highScore = localStorage.getItem('snake_highscore') || 0;
let gameSpeed = INITIAL_SPEED;
let gameLoopId = null;
let particles = [];
let particlesCount = 0;
let isGameOver = false;
let isPaused = true;
let lastTime = 0;

// Input State
const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
const touch = { x: 0, y: 0, active: false };

// Snake
let snake = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    width: GRID_SIZE,
    height: GRID_SIZE,
    body: [],
    dx: 0,
    dy: 0,
    food: { x: 0, y: 0 },
    color: '#00ffff'
};

// Resize handling
function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    snake.width = GRID_SIZE;
    snake.height = GRID_SIZE;
    if (gameLoopId) cancelAnimationFrame(gameLoopId);
}

// Input handling
window.addEventListener('keydown', e => {
    if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
    if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
    if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
    if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
});

window.addEventListener('touchstart', e => {
    if (e.target.tagName === 'BUTTON') return;
    if (e.touches.length === 1) {
        const touch = e.touches[0];
        if (touch.clientX < snake.x && touch.clientX > snake.x - snake.width) keys.a = true;
        if (touch.clientX < snake.x && touch.clientX > snake.x - snake.width) keys.d = true;
        if (touch.clientY < snake.y && touch.clientY > snake.y - snake.height) keys.w = true;
        if (touch.clientY < snake.y && touch.clientY > snake.y - snake.height) keys.s = true;
    }
}, { passive: false });

window.addEventListener('touchend', () => {
    keys.w = false;
    keys.a = false;
    keys.s = false;
    keys.d = false;
});

// Game Logic Functions
function spawnFood() {
    let valid = false;
    while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = true;
        // Don't spawn on snake
        snake.body.forEach(part => {
            if (part.x === food.x && part.y === food.y) {
                valid = false;
                break;
            }
        });
    }
}

function checkCollisions() {
    // Walls
    if (snake.x < 0 || snake.x >= TILE_COUNT || snake.y < 0 || snake.y >= TILE_COUNT) {
        gameOver();
        return true;
    }

    // Self
    snake.body.forEach(part => {
        if (part.x === snake.x && part.y === snake.y) return true;
    });

    return false;
}
