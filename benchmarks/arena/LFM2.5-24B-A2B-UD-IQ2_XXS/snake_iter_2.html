<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Retro</title>
<style>
body{margin:0;background:#0d0d0d;overflow:hidden;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;}
canvas{background:#1a1a1a;border:2px solid #00ff99;cursor:pointer;}
.ui{position:absolute;top:10px;left:10px;color:#00ffcc;font-size:18px;display:flex;gap:20px;}
.high-score{color:#00ff99;}
.gameover{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;background:rgba(0,0,0,0.7);}
.panel{font-size:24px;margin-top:10px;}
button{margin:5px;padding:8px 12px;background:#00ff99;color:#000;border:2px solid #00ffcc;cursor:pointer;font-size:16px;}
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<div class="ui">
  <div>Score: <span id="score">0</span></div>
  <div class="high-score">High: <span id="high">0</span></div>
</div>
<div class="gameover" id="gameover">
  <h2 style="color:#ff5555">Game Over</h2>
  <p>Score: <span id="finalScore">0</span> | High: <span id="finalHigh">0</span></p>
  <button id="restartBtn">Restart</button>
  <button id="pauseBtn">Pause</button>
</div>
<div id="dpad" style="position:absolute;bottom:10px;left:10px;display:flex;flex-direction:column;gap:8px;">
  <button class="dpad-btn" id="btn-up">▲</button>
  <button class="dpad-btn" id="btn-down">▼</button>
  <button class="dpad-btn" id="btn-left">◀</button>
  <button class="dpad-btn" id="btn-right">▶</button>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const tileSize=20;
const cols=20;
const rows=20;

let snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
let direction={x:1,y:0};
let nextDirection={x:1,y:0};
let score=0;
let highScore=parseInt(localStorage.getItem('highScore'))||0;
let gameState='playing';
let particles=[];
let shakeTimer=0;
let shakeOffset={x:0,y:0};

let food=null;

function initAudio(){
  const ctx=new (window.AudioContext || (() => { const c = new AudioContext(); return c; })());
  return ctx;
}
const audioCtx=initAudio();

function resetGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  direction={x:1,y:0};
  nextDirection={x:1,y:0};
  score=0;
  particles=[];
  shakeTimer=0;
  shakeOffset={x:0,y:0};
  placeFood();
}

function placeFood(){
  let pos;
  do{
    pos={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};
  }while(snake.some(seg=>seg.x===pos.x&&seg.y===pos.y));
  food=pos;
}

function spawnParticles(gx,gy){
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*2;
    particles.push({
      x:gx,y:gy,life:0.5,maxLife:0.5,size:3+Math.random()*4,
      color:'#ff5555',vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed
    });
  }
}

function playTone(freq,dur){
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.value=freq;
  gain.gain.value=0.1;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.stop();
}

function updateSnake(){
  const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
  if(head.x<0||head.x>=cols||head.y<0||head.y>=rows)return;
  for(let i=1;i<snake.length;i++){
    if(head.x===snake[i].x&&head.y===snake[i].y)return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;
    playTone(800,0.1);
    spawnParticles(food.x,food.y);
    placeFood();
  }else{
    snake.pop();
  }
}

function gameOver(){
  gameState='gameover';
  playTone(200,0.3);
  shakeTimer=5;
  shakeOffset={x:(Math.random()*4-2),y:(Math.random()*4-2)};
  if(score>highScore){
    highScore=score;
    localStorage.setItem('highScore',highScore);
  }
  document.getElementById('finalScore').textContent=score;
  document.getElementById('finalHigh').textContent=highScore;
  document.getElementById('gameover').style.display='block';
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.life-=0.05;
    if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx||0;
    p.y+=p.vy||0;
  }
}

function render(){
  ctx.save();
  if(gameState==='gameover'&&shakeTimer>0){
    ctx.translate(shakeOffset.x,shakeOffset.y);
  }
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#333';
  ctx.lineWidth=1;
  for(let x=0;x<=cols;x++){
    ctx.beginPath();
    ctx.moveTo(x*tileSize,0);
    ctx.lineTo(x*tileSize,canvas.height);
    ctx.stroke();
  }
  for(let y=0;y<=rows;y++){
    ctx.beginPath();
    ctx.moveTo(0,y*tileSize);
    ctx.lineTo(canvas.width,y*tileSize);
    ctx.stroke();
  }
  if(food){
    ctx.fillStyle='#ff5555';
    ctx.fillRect(food.x*tileSize,food.y*tileSize,tileSize-1,tileSize-1);
  }
  for(let i=0;i<snake.length;i++){
    const seg=snake[i];
    ctx.fillStyle=i===0?'#00ffcc':'#00ff99';
    ctx.fillRect(seg.x*tileSize,seg.y*tileSize,tileSize-1,tileSize-1);
  }
  for(let p of particles){
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x*tileSize,p.y*tileSize,p.size,p.size);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

document.addEventListener('keydown',e=>{
  let dir=null;
  if(e.key==='ArrowUp'||e.key==='w')dir={x:0,y:-1};
  else if(e.key==='ArrowDown'||e.key==='s')dir={x:0,y:1};
  else if(e.key==='ArrowLeft'||e.key==='a')dir={x:-1,y:0};
  else if(e.key==='ArrowRight'||e.key==='d')dir={x:1,y:0};
  if(dir){
    if(direction.x!==-dir.x||direction.y!==-dir.y)nextDirection=dir;
  }
});

const btnUp=document.getElementById('btn-up');
const btnDown=document.getElementById('btn-down');
const btnLeft=document.getElementById('btn-left');
const btnRight=document.getElementById('btn-right');

function setDirection(dir){
  if(gameState==='playing'){
    if(direction.x!==-dir.x||direction.y!==-dir.y)nextDirection=dir;
  }
}

btnUp.addEventListener('touchstart',e=>{e.preventDefault();setDirection({x:0,y:-1});});
btnDown.addEventListener('touchstart',e=>{e.preventDefault();setDirection({x:0,y:1});});
btnLeft.addEventListener('touchstart',e=>{e.preventDefault();setDirection({x:-1,y:0});});
btnRight.addEventListener('touchstart',e=>{e.preventDefault();setDirection({x:1,y:0});});

btnUp.onclick=()=>setDirection({x:0,y:-1});
btnDown.onclick=()=>setDirection({x:0,y:1});
btnLeft.onclick=()=>setDirection({x:-1,y:0});
btnRight.onclick=()=>setDirection({x:1,y:0});

document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(gameState==='playing')gameState='paused';
  else if(gameState==='paused')gameState='playing';
});
document.getElementById('restartBtn').addEventListener('click',()=>resetGame());

let lastTime=0;
const tickInterval=100;

function gameLoop(timestamp){
  const delta=timestamp-lastTime;
  if(delta>=tickInterval){
    if(gameState==='playing')updateSnake();
    updateParticles();
    if(gameState==='gameover'){
      shakeTimer-=1;
      if(shakeTimer<=0){
        ctx.setTransform(1,0,0,1,0,0);
      }
    }
    render();
  }
  lastTime=timestamp;
  requestAnimationFrame(gameLoop);
}

function init(){
  highScore=parseInt(localStorage.getItem('highScore'))||0;
  document.getElementById('high').textContent=highScore;
  resetGame();
  placeFood();
  audioCtx.start();
  requestAnimationFrame(gameLoop);
}
init();
</script>
</body>
</html>
