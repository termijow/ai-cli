<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Viborita - Snake Arcade</title>
<style>
  /* Retro cyberpunk arcade aesthetic */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: 'Courier New', monospace;
    color: #00ffcc;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #050510;
    position: relative;
  }
  #uiLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
    box-sizing: border-box;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    text-shadow: 0 0 4px #00ffcc;
    pointer-events: none;
  }
  .controls-hint {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: 0.7;
    pointer-events: none;
  }
  #gameOverScreen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    z-index: 10;
  }
  #gameOverScreen.show {
    display: flex;
  }
  .d-pad {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 2px solid #00ffcc;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.6);
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .d-pad:active {
    transform: scale(0.95);
  }
  .d-pad-zone {
    width: 60px;
    height: 60px;
    border: 2px solid #00ffcc;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: #00ffcc;
    transition: background 0.1s;
  }
  .d-pad-zone:active {
    background: #00ffcc;
    color: #050510;
  }
  .btn {
    margin-top: 16px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    color: #050510;
    background: #00ffcc;
    border: 2px solid #00ffcc;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:active {
    transform: scale(0.95);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .retro-glow {
    text-shadow: 0 0 10px #00ffcc, 0 0 20px #ff00cc;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="uiLayer">
  <div class="hud">
    <div>Score: <span id="scoreEl">0</span></div>
    <div>High: <span id="highScoreEl">0</span></div>
  </div>
  <div class="controls-hint">
    <div>← → ↑ ↓ / WASD</div>
    <div>Tap to play</div>
  </div>
</div>

<div id="gameOverScreen">
  <div class="retro-glow" style="font-size: 32px; margin-bottom: 8px;">GAME OVER</div>
  <div style="font-size: 18px; margin-bottom: 8px;">Score: <span id="finalScoreEl">0</span></div>
  <div style="font-size: 18px; margin-bottom: 24px;">High Score: <span id="finalHighScoreEl">0</span></div>
  <div class="d-pad" style="display: none;" id="dPadMobile"></div>
  <button class="btn" id="restartBtn">Restart</button>
  <button class="btn" id="pauseBtn" style="display: none;">Pause</button>
</div>

<script>
(function () {
  'use strict';

  // ===== Configuration =====
  var COLS = 24;
  var ROWS = 16;
  var CELL = 16; // px per cell
  var TICK = 0.09; // seconds per tick (11 ticks/sec)
  var MAX_TICK = 0.065; // 15 ticks/sec cap
  var SPEED_UP = 0.002; // tick interval reduction per apple
  var MIN_TICK = 0.065;

  // ===== State =====
  var snake = [];
  var direction = { x: 1, y: 0 };
  var nextDirection = { x: 0, y: 0 };
  var apple = { x: 0, y: 0 };
  var score = 0;
  var highScore = loadHighScore();
  var gameOver = false;
  var paused = false;
  var tickInterval = TICK;
  var lastTimestamp = 0;
  var particles = [];
  var shake = 0;
  var audioCtx = null;
  var keys = { up: false, down: false, left: false, right: false };
  var touchActive = null;
  var dPad = null;

  // ===== DOM refs =====
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('scoreEl');
  var highScoreEl = document.getElementById('highScoreEl');
  var finalScoreEl = document.getElementById('finalScoreEl');
  var finalHighScoreEl = document.getElementById('finalHighScoreEl');
  var restartBtn = document.getElementById('restartBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var gameOverScreen = document.getElementById('gameOverScreen');
  var dPadMobile = document.getElementById('dPadMobile');

  // ===== Audio =====
  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        audioCtx = null;
      }
    }
    return audioCtx;
  }

  function playSound(type) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'move') {
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.0003, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.0006, ctx.currentTime + 0.02);
      gain.gain.exponentialDecayToValue(0.0003, ctx.currentTime + 0.08);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } else if (type === 'apple') {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(1320, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.0005, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      gain.gain.exponentialDecayToValue(0.0005, ctx.currentTime + 0.15);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } else if (type === 'gameover') {
      osc.frequency.setValueAtTime(150, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(450, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.002, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.004, ctx.currentTime + 0.3);
      gain.gain.exponentialDecayToValue(0.002, ctx.currentTime + 0.6);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } else if (type === 'pause') {
      osc.frequency.setValueAtTime(330, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(660, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.002, ctx.currentTime + 0.15);
      gain.gain.exponentialDecayToValue(0.001, ctx.currentTime + 0.2);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    }
  }

  // ===== High score persistence =====
  function loadHighScore() {
    try {
      var hs = localStorage.getItem('snakeHighScore');
      return hs ? parseInt(hs, 10) : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveHighScore() {
    try {
      localStorage.setItem('snakeHighScore', String(score));
    } catch (e) {}
  }

  // ===== Input =====
  function setDirection(dx, dy) {
    if (dx === 0 && dy === 0) return;
    if (dx !== 0 && dx !== direction.x) return;
    if (dy !== 0 && dy !== direction.y) return;
    direction = { x: dx, y: dy };
    nextDirection = { x: dx, y: dy };
  }

  function handleKey(e) {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space' || e.code === 'KeyP') togglePause();
    if (e.code === 'KeyR' || e.code === 'KeyEnter') restartGame();
    e.preventDefault();
  }

  function handleKeyUp(e) {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'Space' || e.code === 'KeyP') togglePause();
    if (e.code === 'KeyR' || e.code === 'KeyEnter') restartGame();
    e.preventDefault();
  }

  function handleTouchStart(e) {
    if (e.touches && e.touches.length > 0) {
      var touch = e.touches[0];
      var rect = dPad.getBoundingClientRect();
      var cx = touch.clientX - rect.left;
      var cy = touch.clientY - rect.top;
      if (cx < rect.width / 2) setDirection(-1, 0);
      if (cx > rect.width / 2) setDirection(1, 0);
      if (cy < rect.height / 2) setDirection(0, -1);
      if (cy > rect.height / 2) setDirection(0, 1);
      touchActive = touch.identifier;
      e.preventDefault();
    }
  }

  function handleTouchEnd(e) {
    if (e.touches && e.touches.length > 0) {
      var touch = e.touches[0];
      if (touch.identifier === touchActive) {
        touchActive = null;
      }
      e.preventDefault();
    }
  }

  function handleTouchMove(e) {
    if (e.touches && e.touches.length > 0) {
      var touch = e.touches[0];
      if (touch.identifier === touchActive) {
        var rect = dPad.getBoundingClientRect();
        var cx = touch.clientX - rect.left;
        var cy = touch.clientY - rect.top;
        if (cx < rect.width / 2) setDirection(-1, 0);
        if (cx > rect.width / 2) setDirection(1, 0);
        if (cy < rect.height / 2) setDirection(0, -1);
        if (cy > rect.height / 2) setDirection(0, 1);
      }
      e.preventDefault();
    }
  }

  // ===== Game logic =====
  function spawnApple() {
    var x, y;
    do {
      x = Math.floor(Math.random() * COLS);
      y = Math.floor(Math.random() * ROWS);
    } while (isSnakeAt(x, y));
    apple = { x: x, y: y };
  }

  function isSnakeAt(x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  function tick() {
    if (gameOver || paused) return;

    // Apply buffered direction
    if (nextDirection.x !== 0 || nextDirection.y !== 0) {
      direction = nextDirection;
      nextDirection = { x: 0, y: 0 };
    }

    var head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver = true;
      shake = 15;
      playSound('gameover');
      return;
    }

    // Self collision
    if (isSnakeAt(head.x, head.y)) {
      gameOver = true;
      shake = 15;
      playSound('gameover');
      return;
    }

    // Move snake
    snake.unshift(head);

    // Apple eaten
    if (head.x === apple.x && head.y === apple.y) {
      score++;
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      tickInterval = Math.max(MIN_TICK, tickInterval - SPEED_UP);
      spawnApple();
      playSound('apple');
      spawnParticles(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2, '#ff00cc');
    } else {
      snake.pop();
    }
  }

  function restartGame() {
    gameOver = false;
    paused = false;
    score = 0;
    scoreEl.textContent = score;
    highScoreEl.textContent = highScore;
    tickInterval = TICK;
    spawnSnake();
    spawnApple();
    gameOverScreen.classList.remove('show');
    restartBtn.disabled = false;
    pauseBtn.style.display = 'inline';
    pauseBtn.disabled = false;
    playSound('move');
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    if (paused) {
      pauseBtn.disabled = true;
      pauseBtn.textContent = 'Resume';
    } else {
      pauseBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
    }
    playSound('pause');
  }

  function spawnSnake() {
    snake = [];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 0, y: 0 };
    snake.push({ x: 0, y: 0 });
  }

  // ===== Particles =====
  function spawnParticles(cx, cy, color) {
    for (var i = 0; i < 12; i++) {
      particles.push({
        x: cx,
        y: cy,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 0.4 + Math.random() * 0.4,
        color: color
      });
    }
  }

  // ===== Rendering =====
  function render() {
    var now = performance.now();
    var elapsed = now - lastRenderTime;
    lastRenderTime = now;

    // Shake effect
    var shakeAmt = Math.max(0, shake * Math.exp(-now / 60));
    var rot = (shakeAmt * 0.5) * Math.sin(now * 0.1);

    ctx.save();
    ctx.translate(CELL * COLS / 2, CELL * ROWS / 2);
    ctx.rotate(rot);
    ctx.scale(1, 1);

    // Background grid
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, CELL * COLS, CELL * ROWS);
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var r = 0; r < ROWS; r++) {
      ctx.moveTo(0, r * CELL);
      ctx.lineTo(CELL * COLS, r * CELL);
    }
    for (var c = 0; c < COLS; c++) {
      ctx.moveTo(c * CELL, 0);
      ctx.lineTo(c * CELL, CELL * ROWS);
    }
    ctx.stroke();

    // Grid lines
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var r = 0; r < ROWS; r++) {
      ctx.moveTo(0, r * CELL);
      ctx.lineTo(CELL * COLS, r * CELL);
    }
    for (var c = 0; c < COLS; c++) {
      ctx.moveTo(c * CELL, 0);
      ctx.lineTo(c * CELL, CELL * ROWS);
    }
    ctx.stroke();

    // Apple
    ctx.fillStyle = '#ff00cc';
    ctx.shadowColor = '#ff00cc';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillRect(apple.x * CELL, apple.y * CELL, CELL, CELL);

    // Snake
    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    for (var i = 0; i < snake.length; i++) {
      var s = snake[i];
      ctx.fillRect(s.x * CELL, s.y * CELL, CELL, CELL);
      // Head highlight
      if (i === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
      }
    }

    // Particles
    for (var p = 0; p < particles.length; p++) {
      var part = particles[p];
      var px = part.x + part.vx;
      var py = part.y + part.vy;
      var life = part.life - elapsed;
      if (life <= 0) {
        particles.splice(p, 1);
        p--;
        continue;
      }
      ctx.fillStyle = part.color;
      ctx.globalAlpha = life;
      ctx.fillRect(px, py, 2, 2);
      part.x = px;
      part.y = py;
      part.vx += (Math.random() - 0.5) * 0.5;
      part.vy += (Math.random() - 0.5) * 0.5;
      part.life -= elapsed;
    }

    ctx.restore();

    // HUD
    ctx.fillStyle = '#00ffcc';
    ctx.font = '14px Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Score: ' + score, CELL * COLS / 2, CELL * ROWS / 2 + 40);
    ctx.fillText('High: ' + highScore, CELL * COLS / 2, CELL * ROWS / 2 + 60);
    ctx.fillText('Speed: ' + Math.round(1000 / tickInterval) + ' t/s', CELL * COLS / 2, CELL * ROWS / 2 + 80);

    // Game over overlay
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, CELL * COLS, CELL * ROWS);
      ctx.fillStyle = '#00ffcc';
      ctx.font = '32px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('GAME OVER', CELL * COLS / 2, CELL * ROWS / 2 - 30);
      ctx.font = '18px Courier New, monospace';
      ctx.fillText('Score: ' + score, CELL * COLS / 2, CELL * ROWS / 2 + 10);
      ctx.fillText('High: ' + highScore, CELL * COLS / 2, CELL * ROWS / 2 + 30);
    }
  }

  // ===== Init =====
  function init() {
    canvas.width = CELL * COLS;
    canvas.height = CELL * ROWS;

    scoreEl.textContent = score;
    highScoreEl.textContent = highScore;

    // Keyboard
    window.addEventListener('keydown', handleKey);
    window.addEventListener('keyup', handleKeyUp);

    // Touch
    dPadMobile.style.display = 'flex';
    dPadMobile.addEventListener('touchstart', handleTouchStart);
    dPadMobile.addEventListener('touchmove', handleTouchMove);
    dPadMobile.addEventListener('touchend', handleTouchEnd);
    dPadMobile.addEventListener('touchcancel', handleTouchEnd);

    // Prevent mobile scrolling
    if ('ontouchstart' in window) {
      window.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 0) {
          e.preventDefault();
        }
      }, { passive: false });
    }

    // Buttons
    restartBtn.addEventListener('click', restartGame);
    pauseBtn.addEventListener('click', togglePause);

    // Initial game
    spawnSnake();
    spawnApple();
    gameLoop();
  }

  function gameLoop(timestamp) {
    var delta = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    if (!paused && !gameOver) {
      if (delta > 0) {
        if (delta >= tickInterval) {
          tick();
        }
      }
    }

    render();

    requestAnimationFrame(gameLoop);
  }

  init();
})();
</script>
</body>
</html>
