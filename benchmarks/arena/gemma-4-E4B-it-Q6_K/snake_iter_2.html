<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberSnake // ARCADE</title>
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --dark-bg: #0a0a1a;
            --grid-color: rgba(0, 255, 255, 0.1);
        }
        body {
            background-color: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border: 2px solid var(--neon-cyan);
        }
        canvas {
            display: block;
            background-color: #000000;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2em;
            z-index: 10;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 20;
            transition: opacity 0.3s;
        }
        #game-over-screen h1 {
            color: var(--neon-magenta);
            text-shadow: 0 0 10px var(--neon-magenta);
            margin-bottom: 20px;
        }
        .control-button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1.1em;
            cursor: pointer;
            background: var(--neon-cyan);
            color: var(--dark-bg);
            border: none;
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: background 0.1s;
        }
        .control-button:active {
            background: var(--neon-magenta);
            box-shadow: 0 0 10px var(--neon-magenta);
        }
        #dpad-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 150px;
            height: 150px;
            z-index: 15;
            display: grid;
            grid-template-areas: 
                ". up ."
                "left . right"
                ". down .";
            gap: 5px;
        }
        .dpad-button {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
            font-size: 1.5em;
        }
        #dpad-up { grid-area: up; }
        #dpad-down { grid-area: down; }
        #dpad-left { grid-area: left; }
        #dpad-right { grid-area: right; }

        @media (max-width: 600px) {
            #dpad-container {
                left: 5px;
                bottom: 5px;
            }
            .control-button {
                font-size: 1em;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body id="body">

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-overlay">
            <div id="score-display">SCORE: 0</div>
            <div id="high-score-display">HIGH SCORE: 0</div>
        </div>

        <div id="game-over-screen" style="opacity: 0;">
            <h1 id="game-status-text">CYBERSNAKE</h1>
            <p id="final-score-text">Press START to begin.</p>
            <button id="start-button" class="control-button">START GAME</button>
            <div style="margin-top: 20px;">
                <button id="pause-button" class="control-button" style="display: none;">PAUSE</button>
                <button id="restart-button" class="control-button" style="display: none;">RESTART</button>
            </div>
        </div>

        <div id="dpad-container">
            <div id="dpad-up" class="dpad-button">▲</div>
            <div id="dpad-left" class="dpad-button">◀</div>
            <div id="dpad-right" class="dpad-button">▶</div>
            <div id="dpad-down" class="dpad-button">▼</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const body = document.getElementById('body');
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startButton = document.getElementById('start-button');
        const pauseButton = document.getElementById('pause-button');
        const restartButton = document.getElementById('restart-button');
        const gameStatusText = document.getElementById('game-status-text');
        const finalScoreText = document.getElementById('final-score-text');

        const GRID_SIZE = 20;
        const TILE_COUNT = 25;
        canvas.width = GRID_SIZE * TILE_COUNT;
        canvas.height = GRID_SIZE * TILE_COUNT;

        let snake = [];
        let food = {};
        let dx = GRID_SIZE;
        let dy = 0;
        let score = 0;
        let highScore = 0;
        let gameLoopInterval = null;
        let isRunning = false;
        let isPaused = true;
        let lastTime = 0;
        let gameSpeed = 100; // Milliseconds per tick (10 TPS)
        let shakeIntensity = 0;
        let shakeDuration = 0;

        // --- AUDIO ENGINE ---
        let audioContext;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(frequency, duration, type = 'sine', volume = 0.2) {
            if (!audioContext || audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration / 1000);

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration / 1000);
        }

        function playEatSound() {
            playSound(440, 100, 'square', 0.3);
        }

        function playDeathSound() {
            playSound(100, 300, 'sawtooth', 0.5);
        }

        // --- EFFECT MANAGER ---
        function triggerScreenShake(intensity, duration) {
            shakeIntensity = intensity;
            shakeDuration = duration;
        }

        // --- GAME LOGIC ---

        function initGame() {
            initAudio(); // Initialize audio context on user interaction
            
            snake = [{ x: 10 * GRID_SIZE, y: 10 * GRID_SIZE }];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            isPaused = false;
            isRunning = true;
            
            updateScoreDisplay();
            loadHighScore();
            placeFood();
            
            gameOverScreen.style.opacity = '0';
            gameOverScreen.style.pointerEvents = 'none';
            startButton.style.display = 'none';
            pauseButton.style.display = 'inline-block';
            restartButton.style.display = 'none';
            gameStatusText.textContent = "CYBERSNAKE";
            finalScoreText.textContent = "";

            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(gameTick, gameSpeed);
        }

        function placeFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE,
                    y: Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            food = newFood;
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = `SCORE: ${score}`;
        }

        function loadHighScore() {
            const storedScore = localStorage.getItem('snakeHighScore');
            highScore = storedScore ? parseInt(storedScore) : 0;
            highScoreDisplay.textContent = `HIGH SCORE: ${highScore}`;
        }

        function saveHighScore() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreDisplay.textContent = `HIGH SCORE: ${highScore}`;
            }
        }

        function gameTick() {
            if (!isRunning || isPaused) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 1. Wall Collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // 2. Self Collision
            if (snake.some((segment, index) => index !== 0 && segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // Move snake
            snake.unshift(head);

            // 3. Food Consumption
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                playEatSound();
                updateScoreDisplay();
                placeFood();
                triggerScreenShake(5, 100);
                
                // Increase speed slightly every 5 points
                if (score % 50 === 0 && gameSpeed > 40) {
                    gameSpeed -= 5;
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = setInterval(gameTick, gameSpeed);
                }
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameLoopInterval);
            saveHighScore();
            playDeathSound();
            triggerScreenShake(15, 500);

            gameStatusText.textContent = "GAME OVER";
            finalScoreText.textContent = `Final Score: ${score}. Press RESTART to try again.`;
            
            gameOverScreen.style.opacity = '1';
            gameOverScreen.style.pointerEvents = 'auto';
            startButton.style.display = 'none';
            pauseButton.style.display = 'none';
            restartButton.style.display = 'inline-block';
        }

        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                clearInterval(gameLoopInterval);
                pauseButton.textContent = "RESUME";
                gameStatusText.textContent = "PAUSED";
                finalScoreText.textContent = "Press RESUME to continue.";
            } else {
                gameLoopInterval = setInterval(gameTick, gameSpeed);
                pauseButton.textContent = "PAUSE";
                gameStatusText.textContent = "CYBERSNAKE";
                finalScoreText.textContent = "";
            }
        }

        // --- RENDERING ---

        function drawGrid() {
            ctx.strokeStyle = 'var(--grid-color)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < TILE_COUNT; x++) {
                for (let y = 0; y < TILE_COUNT; y++) {
                    ctx.strokeRect(x * GRID_SIZE, y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                }
            }
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? 'var(--neon-magenta)' : 'var(--neon-cyan)';
                ctx.shadowColor = index === 0 ? 'var(--neon-magenta)' : 'var(--neon-cyan)';
                ctx.shadowBlur = 10;
                
                ctx.fillRect(segment.x, segment.y, GRID_SIZE - 1, GRID_SIZE - 1);
            });
            ctx.shadowBlur = 0; // Reset shadow
        }

        function drawFood() {
            ctx.fillStyle = 'var(--neon-magenta)';
            ctx.shadowColor = 'var(--neon-magenta)';
            ctx.shadowBlur = 15;
            ctx.fillRect(food.x, food.y, GRID_SIZE - 1, GRID_SIZE - 1);
            ctx.shadowBlur = 0;
        }

        function drawParticles() {
            if (shakeDuration > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(canvas.width / 2 + Math.random() * 20 - 10, canvas.height / 2 + Math.random() * 20 - 10, 2, 2);
            }
        }

        function render(timestamp) {
            // Apply screen shake offset
            let offsetX = 0;
            let offsetY = 0;
            if (shakeDuration > 0) {
                offsetX = (Math.random() - 0.5) * shakeIntensity;
                offsetY = (Math.random() - 0.5) * shakeIntensity;
                shakeDuration -= 16; // Assuming 60 FPS rendering
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid first
            drawGrid();

            // Draw elements with offset
            ctx.save();
            ctx.translate(offsetX, offsetY);

            drawFood();
            drawSnake();
            drawParticles();

            ctx.restore();

            requestAnimationFrame(render);
        }

        // --- INPUT HANDLERS ---

        function changeDirection(newDx, newDy) {
            // Prevent immediate reversal
            if ((newDx !== 0 && dx === -newDx) || (newDy !== 0 && dy === -newDy)) {
                return;
            }
            dx = newDx;
            dy = newDy;
        }

        document.addEventListener('keydown', e => {
            if (isPaused && e.key !== 'Enter' && e.key !== ' ') return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection(0, -GRID_SIZE);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection(0, GRID_SIZE);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection(-GRID_SIZE, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection(GRID_SIZE, 0);
                    break;
                case ' ': // Spacebar for pause/start
                    if (isRunning) togglePause();
                    break;
                case 'Enter':
                    if (gameOverScreen.style.opacity === '1') {
                        if (gameStatusText.textContent === "GAME OVER") {
                            initGame();
                        } else {
                            togglePause();
                        }
                    }
                    break;
            }
        });

        // Touch D-Pad Handlers
        document.getElementById('dpad-up').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(0, -GRID_SIZE); });
        document.getElementById('dpad-down').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(0, GRID_SIZE); });
        document.getElementById('dpad-left').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(-GRID_SIZE, 0); });
        document.getElementById('dpad-right').addEventListener('touchstart', (e) => { e.preventDefault(); changeDirection(GRID_SIZE, 0); });

        // UI Button Handlers
        startButton.addEventListener('click', initGame);
        restartButton.addEventListener('click', initGame);
        pauseButton.addEventListener('click', togglePause);

        // --- INITIALIZATION ---
        loadHighScore();
        render(); // Start the rendering loop immediately
    </script>
</body>
</html>
