<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Snake</title>
<style>
body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#111; }
canvas { display:block; }
button { margin:5px; padding:6px 12px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c" width="400" height="300"></canvas>
<button id="restartBtn">Restart</button>
<button id="pauseBtn">Pause</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const canvasW = canvas.width;
const canvasH = canvas.height;

let snake = [[Math.floor(canvasW/2), Math.floor(canvasH/2)]];
let dir = {x:1, y:0};
let nextDir = {x:1, y:0};
let apple = {x:0, y:0};
let score = 0;
let highScore = parseInt(localStorage.getItem('highScore')) || 0;
let paused = false;
let gameOver = false;
let lastGameTime = performance.now();
let particles = [];
let shake = false;

function getRandomApple() {
  let pos;
  do {
    pos = [Math.floor(Math.random()*canvasW), Math.floor(Math.random()*canvasH)];
  } while (snake.some(p => p[0]===pos[0] && p[1]===pos[1]));
  return pos;
}
function spawnParticles() {
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: snake[0][0] + dir.x,
      y: snake[0][1] + dir.y,
      life: 200
    });
  }
}
function moveSnake() {
  const hx = snake[0][0] + dir.x;
  const hy = snake[0][1] + dir.y;
  if (hx < 0 || hx >= canvasW || hy < 0 || hy >= canvasH) {
    gameOver = true;
    return;
  }
  for (let i = 1; i < snake.length; i++) {
    if (hx === snake[i][0] && hy === snake[i][1]) {
      gameOver = true;
      return;
    }
  }
  snake.unshift([hx, hy]);
  snake.pop();
  if (snake[0][0] === apple.x && snake[0][1] === apple.y) {
    score += 10;
    apple = getRandomApple();
    spawnParticles();
  }
}
function drawGame() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvasW,canvasH);
  // faint grid
  for (let i = 0; i < canvasW; i += 10) {
    ctx.strokeStyle = '#555';
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, canvasH);
    ctx.stroke();
  }
  for (let i = 0; i < canvasW; i += 10) {
    ctx.strokeStyle = '#555';
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(canvasW, i);
    ctx.stroke();
  }
  // snake
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 2;
  for (let i = 0; i < snake.length - 1; i++) {
    ctx.beginPath();
    ctx.moveTo(snake[i][0], snake[i][1]);
    ctx.lineTo(snake[i+1][0], snake[i+1][1]);
    ctx.stroke();
  }
  // apple
  ctx.beginPath();
  ctx.arc(apple.x, apple.y, 4, 0, Math.PI*2);
  ctx.fillStyle = '#f0f';
  ctx.fill();
  // score
  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.fillText(`Score: ${score}`, 10, 10);
  // particles
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
    ctx.fillStyle = '#ff0';
    ctx.fill();
  }
  // game over overlay
  if (gameOver) {
    ctx.fillStyle = '#111';
    ctx.fillRect(0,0,canvasW,canvasH);
    if (shake) {
      ctx.fillStyle = '#ff0';
      ctx.fillRect(0,0,canvasW,canvasH);
    }
  }
}
function loop(timestamp) {
  if (gameOver) {
    drawGame();
    return;
  }
  if (paused) return;
  const delta = timestamp - lastGameTime;
  lastGameTime = timestamp;
  moveSnake();
  drawGame();
  requestAnimationFrame(loop);
}
// keyboard
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp': nextDir = {x:0, y:-1}; break;
    case 'ArrowDown': nextDir = {x:0, y:1}; break;
    case 'ArrowLeft': nextDir = {x:-1, y:0}; break;
    case 'ArrowRight': nextDir = {x:1, y:0}; break;
    case 'w': nextDir = {x:0, y:-1}; break;
    case 'a': nextDir = {x:-1, y:0}; break;
    case 'd': nextDir = {x:1, y:0}; break;
  }
});
// touch controls
let touchStart = null;
function handleTouchStart(e) {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}
function handleTouchEnd(e) {
  if (touchStart) {
    const {x, y} = touchStart;
    if (x > canvasW/2) {
      nextDir = {x:1, y:0};
    } else if (y > canvasH/2) {
      nextDir = {x:0, y:1};
    } else if (x < canvasW/2) {
      nextDir = {x:-1, y:0};
    } else {
      nextDir = {x:0, y:-1};
    }
    touchStart = null;
  }
}
document.addEventListener('touchstart', handleTouchStart);
document.addEventListener('touchend', handleTouchEnd);
// buttons
document.getElementById('restartBtn').onclick = () => {
  snake = [[Math.floor(canvasW/2), Math.floor(canvasH/2)]];
  dir = {x:1, y:0};
  apple = getRandomApple();
  score = 0;
  gameOver = false;
  paused = false;
  lastGameTime = performance.now();
  particles = [];
  shake = false;
};
document.getElementById('pauseBtn').onclick = () => {
  paused = !paused;
};
// audio
let audioCtx;
let oscillator;
let gain;
function playBeep() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    oscillator = audioCtx.createOscillator();
    gain = audioCtx.createGain();
    oscillator.connect(gain);
    gain.connect(audioCtx.destination);
    oscillator.frequency.value = 440;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.1);
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
