<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #0f0; }
    canvas { display: block; }
    #gameOver {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: center; align-items: center;
      font-family: sans-serif; color: #fff; background: rgba(0,0,0,0.7);
    }
    #gameOver button {
      padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="gameOver">
    <button id="restart">Restart</button>
    <button id="pause">Pause</button>
  </div>
  <script>
    let audioContext;
    let gainNode;
    function initAudio() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.connect(audioContext.destination);
      } catch (e) {
        // Fallback: no audio
      }
    }
    initAudio();

    function playTone(freq, duration) {
      if (!audioContext) return;
      if (audioContext.state === audioContext.SUSPENDED) audioContext.resume();
      const osc = audioContext.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const gain = audioContext.createGain();
      gain.gain.setValueAtTime(0.1, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(audioContext.currentTime);
      osc.stop(audioContext.currentTime + duration);
    }

    function playEatSound() {
      playTone(880, 0.15);
    }

    function playDeathSound() {
      playTone(660, 0.2);
    }

    function drawParticles(fx, fy) {
      const cx = fx * (canvasW / GRID_SIZE);
      const cy = fy * (canvasH / GRID_SIZE);
      const radius = 2;
      const count = 3;
      for (let i = 0; i < count; i++) {
        const dx = (Math.random() * 2 - 1) * radius;
        const dy = (Math.random() * 2 - 1) * radius;
        ctx.beginPath();
        ctx.arc(cx + dx, cy + dy, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      }
    }

    function generateFood() {
      let f;
      do {
        f = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE)
        };
      } while (snake.some(p => p.x === f.x && p.y === f.y));
      return f;
    }

    const GRID_SIZE = 20;
    const canvasW = 400;
    const canvasH = 400;
    let snake = [{ x: GRID_SIZE / 2, y: GRID_SIZE / 2 }];
    let inputDirection = { dx: 0, dy: 0 };
    let food = generateFood();
    let score = 0;
    let highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0;
    let gameState = 'playing';
    let paused = false;
    let shakeActive = false;
    let shakeDuration = 0;
    let accumulator = 0;
    let lastTime = performance.now();

    const TARGET_TICKS_PER_SECOND = 12;
    const TICK_INTERVAL_MS = Math.round(1000 / TARGET_TICKS_PER_SECOND);

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function drawEverything() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvasW, canvasH);

      // Grid
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * (canvasW / GRID_SIZE), 0);
        ctx.lineTo(i * (canvasW / GRID_SIZE), canvasH);
        ctx.stroke();
      }
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * (canvasH / GRID_SIZE));
        ctx.lineTo(canvasW, i * (canvasH / GRID_SIZE));
        ctx.stroke();
      }

      // Snake
      ctx.fillStyle = '#0ff';
      for (let s of snake) {
        ctx.beginPath();
        ctx.moveTo(s.x * (canvasW / GRID_SIZE), s.y * (canvasH / GRID_SIZE));
        ctx.lineTo((s.x + 1) * (canvasW / GRID_SIZE), (s.y + 1) * (canvasH / GRID_SIZE));
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#f0f';
      ctx.beginPath();
      ctx.arc(food.x * (canvasW / GRID_SIZE) + (
