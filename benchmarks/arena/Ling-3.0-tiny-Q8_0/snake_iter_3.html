<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SERPENT - Juego de Serpiente Retro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #06060c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 400px;
            max-width: 90vw;
            max-height: 90vw;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3), 0 0 40px rgba(0, 255, 65, 0.1);
            image-rendering: pixelated;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #00ff41;
            font-size: 14px;
            text-shadow: 0 0 5px #00ff41;
            pointer-events: none;
            z-index: 10;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 6, 12, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #gameOverScreen h1 {
            color: #ff0044;
            font-size: 36px;
            text-shadow: 0 0 10px #ff0044;
            margin-bottom: 20px;
        }
        #gameOverScreen p {
            color: #00ff41;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .btn {
            background: #00ff41;
            color: #06060c;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            margin: 5px;
        }
        .btn:hover {
            background: #00cc33;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }
        .btn:active {
            transform: scale(0.95);
        }
        #controls {
            margin-top: 15px;
            color: #00ff41;
            font-size: 12px;
            text-align: center;
            opacity: 0.7;
        }
        #touchControls {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }
        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 65, 0.2);
            border: 2px solid #00ff41;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff41;
            font-size: 20px;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
        }
        .dpad-btn:active {
            background: rgba(0, 255, 65, 0.5);
        }
        .dpad-up { top: 10px; left: 50%; transform: translateX(-50%); }
        .dpad-down { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .dpad-left { top: 50%; left: 10px; transform: translateY(-50%); }
        .dpad-right { top: 50%; right: 10px; transform: translateY(-50%); }
        .dpad-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15px;
            height: 15px;
            background: rgba(0, 255, 65, 0.3);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="hud">
            <span id="scoreDisplay">Puntuación: 0</span>
            <span id="highScoreDisplay">Récord: 0</span>
            <span id="levelDisplay">Nivel: 1</span>
        </div>
        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p>Tu puntuación: <span id="finalScore">0</span></p>
            <button class="btn" id="restartBtn">Reiniciar</button>
            <button class="btn" id="pauseBtn">Pausa</button>
        </div>
        <div id="touchControls">
            <div class="dpad-btn dpad-up" data-dir="up">▲</div>
            <div class="dpad-btn dpad-down" data-dir="down">▼</div>
            <div class="dpad-btn dpad-left" data-dir="left">◀</div>
            <div class="dpad-btn dpad-right" data-dir="right">▶</div>
            <div class="dpad-center"></div>
        </div>
        <div id="controls">
            Controles: Flechas / WASD / D-Pad táctil
        </div>
    </div>

    <script>
        // ... JavaScript code
    </script>
</body>
</html>
