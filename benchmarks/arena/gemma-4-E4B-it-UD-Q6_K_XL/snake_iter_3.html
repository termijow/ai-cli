    <style>
        :root {
            --color-bg: #0a0a1a;
            --color-neon-green: #39ff14;
            --color-neon-magenta: #ff00ff;
            --color-grid: rgba(57, 255, 20, 0.1);
            --color-ui: #00ffff;
        }
        body {
            background-color: var(--color-bg);
            color: var(--color-ui);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 90vw;
            max-width: 600px;
        }
        #gameCanvas {
            border: 2px solid var(--color-neon-green);
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px var(--color-neon-green);
            touch-action: none;
        }
        #ui-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 1.2em;
            text-shadow: 0 0 5px var(--color-ui);
        }
        #controls {
            display: none;
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
            justify-content: center;
        }
        .dpad-row {
            display: flex;
            justify-content: center;
        }
        .dpad-button {
            width: 60px;
            height: 60px;
            background-color: rgba(0, 255, 255, 0.1);
            border: 2px solid var(--color-ui);
            color: var(--color-ui);
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.1s;
            margin: 2px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .dpad-button:active {
            background-color: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px var(--color-ui);
        }
        #up-button { grid-area: up; }
        #left-button { grid-area: left; }
        #right-button { grid-area: right; }
        #down-button { grid-area: down; }

        @media (max-width: 650px) {
            #controls {
                display: grid;
                grid-template-areas:
                    ". up ."
                    "left . right"
                    ". down .";
                grid-template-columns: 1fr 1fr 1fr;
                gap: 5px;
            }
            .dpad-button {
                width: 50px;
                height: 50px;
                font-size: 1.2em;
            }
        }

            text-align: center;
            z-index: 10;

            font-size: 1.2em;

            background-color: var(--color-neon-green);

            transition: transform 0.1s;
        }
        .game-button:hover {
            transform: scale(1.05);
        }
        .game-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

                oscillator.stop(this.audioContext.currentTime + duration / 1000);
