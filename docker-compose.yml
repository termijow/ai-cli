services:
  backend:
    build: ./backend
    container_name: ai-cli-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3094:3094"
    environment:
      - LLAMA_URL=http://host.docker.internal:1234
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3094/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: ai-cli-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
